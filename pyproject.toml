[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Multi-agent anomaly detection and analysis for financial time-series data"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── UI / API ──────────────────────────────
    "gradio==6.26.0",
    "gradio-client==2.6.1",
    "orjson>=3.9,<4",
    "pillow==12.3.0",

    # ── 科学計算 / ML ────────────────────────
    "numpy>=1.26,<1.27",
    "protobuf==6.33.5",
    "tensorflow==2.21.0",
    "keras==3.15.0",
    "scipy>=1.11.4,<1.12",
    "scikit-learn==1.5.0",

    # ── 可視化・ユーティリティ ──────────────
    "plotly>=6.0.1",
    "matplotlib>=3.7.3",
    "kiwisolver==1.4.5",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.1.4,<2.2",
    "yfinance==1.7.0",
    "beautifulsoup4>=4.9.0",
    "python-dotenv>=0.19.0",
    "requests>=2.25.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.13",
]

[tool.setuptools]
py-modules = ["app_improved", "config", "evaluation", "main", "realtime_data_provider"]

[tool.setuptools.packages.find]
include = ["agents*", "detection*", "models*", "services*", "ui*", "utils*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # Gradioは関数引数の gr.Progress() で進捗を注入する

[tool.rye]
installer = "pip"
