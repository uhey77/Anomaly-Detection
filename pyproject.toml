[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Multi-agent anomaly detection and analysis for financial time-series data"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── UI / API ──────────────────────────────
    "streamlit==1.67.0",
    "orjson>=3.13,<4",
    "pillow==13.0.0",
    "pyarrow>=26.0,<27"

    # ── 科学計算 / ML ────────────────────────
    "numpy>=2.1,<2.2",  # TensorFlow 2.21とのABI互換範囲,
    "protobuf>=6.33.5,<7",
    "tensorflow==2.21.0",  # 2026-11時点の安定最新版,
    "keras>=3.15,<4",
    "scipy>=1.17,<2",
    "scikit-learn>=1.9,<2",

    # ── 可視化・ユーティリティ ──────────────
    "plotly>=7,<8",
    "matplotlib>=3.10,<4",
    "kiwisolver>=1.4.5,<2",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.3,<3",  # pandas 3はAPI変更が大きいため別PRで検証,
    "yfinance>=1.7,<2",
    "beautifulsoup4>=4.14,<5",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
py-modules = ["app_improved", "config", "evaluation", "main", "realtime_data_provider"]

[tool.setuptools.packages.find]
include = ["agents*", "detection*", "models*", "services*", "ui*", "utils*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.rye]
installer = "pip"
