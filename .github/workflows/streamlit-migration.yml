name: Streamlit migration verification

on:
  push:
    branches: [refactor/streamlit-pillow13]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve production and development locks for the existing Mac target
        run: |
          uv pip compile pyproject.toml --python-version 3.12 --python-platform aarch64-apple-darwin --output-file requirements.lock
          uv pip compile pyproject.toml --extra dev --python-version 3.12 --python-platform aarch64-apple-darwin --output-file requirements-dev.lock
      - name: Install and verify dependencies
        run: |
          uv venv --python 3.12
          uv pip sync requirements-dev.lock
          uv pip check
      - name: Verify Python code and unit tests
        run: |
          .venv/bin/python -m compileall -q .
          .venv/bin/python -m unittest discover -v
          .venv/bin/ruff check .
      - name: Commit reproducible dependency locks to migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/streamlit-pillow13'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Pillow 13 Streamlit dependency locks"
            git push
          fi
